<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan 10K Chico</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f4">
<link rel="apple-touch-icon" href="icon-v3-180.png">
<link rel="icon" href="icon-v3-180.png">
<link rel="manifest" href="manifest-chico.webmanifest">
<script>window.__OCR_LOCAL=true;</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Concepto: app de actividad clara. Fondo gris muy suave, tarjetas blancas redondeadas,
   un acento verde azulado para correr, violeta para gimnasio y coral para el 10K. */
:root{
  --bg:#f3f5f4; --card:#ffffff; --field:#f1f4f3; --line:#e2e7e5;
  --ink:#1c2220; --mut:#66716d; --faint:#9ba6a2;
  --teal:#0b8a7e; --teal-2:#d3eeea; --teal-ink:#06645b;
  --violet:#7a5fc8; --violet-2:#ece6fb;
  --coral:#e2684d; --coral-2:#fce3dc;
  --amber:#b07a0c; --amber-2:#fbefd2; --red:#c4473c; --red-2:#f9e0dd;
  --font:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit}
.wrap{max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* barra superior */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:56px}
.top .cd{justify-self:start;font-size:13px;font-weight:600;color:var(--mut);background:var(--card);border-radius:999px;padding:5px 11px}
.top .brand{font-size:19px;font-weight:700;letter-spacing:-.01em}
.top .av{justify-self:end;width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;font-size:15px}

/* tarjetas */
.card{background:var(--card);border-radius:22px;padding:18px;margin:12px 0}
.card h2,.secttl{margin:0 0 12px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.secttl{margin:24px 4px 10px}
.mut{color:var(--mut)}
.small{font-size:13px;color:var(--mut)}

/* HOY: anillos */
.weekhead{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 6px;font-weight:600;font-size:15px}
.weekhead button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.weekhead button:disabled{opacity:.25}
.ring{position:relative;flex:0 0 auto}
.ring svg{display:block;width:100%;height:100%}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero-ring{margin:0 auto}
.hero-ring .ic{width:38px;height:38px;color:var(--teal);margin-bottom:6px}
.hero-ring b{font-size:44px;line-height:1;font-weight:700;letter-spacing:-.02em}
.hero-ring span{font-size:14px;color:var(--mut);margin-top:4px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.mini{display:flex;flex-direction:column;align-items:center;text-align:center}
.mini .ring-in b{font-size:16px;font-weight:700}
.mini .ring-in .ic{width:20px;height:20px}
.mini span{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.25}

/* HOY: siguiente sesión */
.hero{display:block;width:100%;text-align:left;border-radius:22px;padding:20px;margin:16px 0 12px;color:#fff;background:linear-gradient(135deg,#0b8a7e,#0f6f8a)}
.hero.t-gym{background:linear-gradient(135deg,#7a5fc8,#5a4aa8)}
.hero.t-race{background:linear-gradient(135deg,#e2684d,#c94f6b)}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero b{display:block;font-size:26px;line-height:1.15;font-weight:700;margin:6px 0 4px;letter-spacing:-.01em}
.hero .s{font-size:15px;opacity:.92}
.hero .go{display:inline-flex;align-items:center;gap:4px;margin-top:14px;background:rgba(255,255,255,.2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.hero .go .ic{width:16px;height:16px}

/* HOY: días de la semana */
.wdays .top2{display:flex;justify-content:space-between;align-items:flex-end}
.wdays .cnt{font-size:30px;font-weight:700;line-height:1}
.wdays .cnt small{font-size:16px;font-weight:500;color:var(--mut)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.bars button,.bars div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.bars i{display:grid;place-items:center;width:100%;max-width:30px;height:52px;border-radius:999px;background:var(--field);color:#fff}
.bars i .ic{width:16px;height:16px;stroke-width:2.6}
.bars .run i{background:var(--teal-2)} .bars .gym i{background:var(--violet-2)} .bars .race i{background:var(--coral-2)}
.bars .run.done i{background:var(--teal)} .bars .gym.done i{background:var(--violet)} .bars .race.done i{background:var(--coral)}
.bars .miss i{background:var(--amber-2);color:var(--amber)}
.bars .tdy span{color:var(--ink);font-weight:700}

/* estado */
details.status summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
details.status summary::-webkit-details-marker{display:none}
details.status summary .chev{margin-left:auto;color:var(--faint);transition:transform .2s}
details.status[open] summary .chev{transform:rotate(90deg)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--teal);flex:0 0 auto}
.dot.warn{background:var(--amber)} .dot.bad{background:var(--red)} .dot.info{background:var(--faint)}
.st{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:12px 0 0;font-size:14px}
.st+.st{border-top:1px solid var(--line);margin-top:12px}
.st span:first-child{font-weight:600;color:var(--mut)}

/* PLAN */
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 2px 6px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--card);font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap}
.chip.on{background:var(--teal);color:#fff}
.chip .nowdot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.chip.on .nowdot{background:#fff}
.whead{display:flex;justify-content:space-between;align-items:flex-end;margin:14px 4px 8px}
.whead h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.whead p{margin:2px 0 0;color:var(--mut);font-size:14px}
.whead .km{text-align:right;font-size:14px;color:var(--mut)}
.whead .km b{display:block;font-size:18px;color:var(--ink)}
.pbar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin:0 4px 6px}
.pbar i{display:block;height:100%;background:var(--teal);border-radius:999px}
.list{background:var(--card);border-radius:22px;overflow:hidden;margin:12px 0}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-top:1px solid var(--line);min-height:68px}
.list>.row:first-child{border-top:0}
.row .dt{width:42px;flex:0 0 auto;text-align:center;line-height:1.1}
.row .dt small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.row .dt b{font-size:20px;font-weight:700}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;font-size:16px}
.row .tx em{display:block;font-style:normal;font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .bd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;border:2px solid var(--line);color:#fff}
.row .bd .ic{width:16px;height:16px;stroke-width:2.6}
.row.run .bd.done{background:var(--teal);border-color:var(--teal)}
.row.gym .bd.done{background:var(--violet);border-color:var(--violet)}
.row.race .bd.done{background:var(--coral);border-color:var(--coral)}
.row .bd.miss{border-color:var(--amber);background:var(--amber-2);color:var(--amber);font-weight:700;font-size:14px}
.row .tag{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.row.run .tag{background:var(--teal)} .row.gym .tag{background:var(--violet)} .row.race .tag{background:var(--coral)}
.row.rest{min-height:52px;color:var(--faint)}
.row.rest .dt b{font-size:16px;color:var(--faint)} .row.rest .tx em{color:var(--faint)}
.row.today .dt b{color:var(--teal)}
.note{border-radius:16px;padding:12px 14px;margin:10px 0;font-size:14px;background:var(--amber-2);color:#6b4b07}
.note ul{margin:4px 0 0;padding-left:18px}
.note.ok{background:var(--teal-2);color:var(--teal-ink)}
.note.bad{background:var(--red-2);color:#7d2a22}
details.guide summary{font-weight:700;cursor:pointer}
details.guide ul{margin:10px 0 0;padding-left:18px;color:var(--mut);font-size:14px}
details.guide li{margin:6px 0}

/* hoja de sesión */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(18,26,24,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg{animation:none}}
.handle{width:40px;height:5px;border-radius:999px;background:#cfd6d3;margin:0 auto 6px}
.sh-x{position:absolute;top:12px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--mut)}
.sh-chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 48px 10px 0}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card);color:var(--mut)}
.pill.run{background:var(--teal-2);color:var(--teal-ink)} .pill.gym{background:var(--violet-2);color:#4d3a92} .pill.race{background:var(--coral-2);color:#9a3a26}
.pill.ok{background:var(--teal);color:#fff} .pill.miss{background:var(--amber-2);color:var(--amber)}
.sh-t{margin:4px 0 2px;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.015em}
.sh-s{margin:0 0 12px;color:var(--mut);font-size:15px}
.steps{background:var(--card);border-radius:20px;padding:6px 16px;margin:12px 0}
.step{display:flex;gap:12px;padding:12px 0}
.step+.step{border-top:1px solid var(--line)}
.step i{width:28px;height:28px;border-radius:50%;background:var(--teal-2);color:var(--teal-ink);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;flex:0 0 auto}
.step b{display:block;font-weight:600}
.step span{font-size:14px;color:var(--mut)}
.adj{font-size:13px;color:var(--amber);margin:6px 2px}
.h3{margin:22px 2px 10px;font-size:17px;font-weight:700}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fld{background:var(--card);border-radius:16px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fld span{font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld input{width:100%;min-width:0;border:0;background:transparent;padding:2px 0;font-size:22px;font-weight:700;color:var(--ink);-webkit-appearance:none;appearance:none}
.fld input::placeholder{color:#c3ccc9;font-weight:600}
.fld input:focus{outline:none}
.fld:focus-within{box-shadow:0 0 0 2px var(--teal)}
.derived{margin:8px 4px 0;font-size:14px;color:var(--teal-ink);font-weight:500}
.derived.warn{color:var(--amber)}
.shotbtn{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;margin:0 0 10px;color:var(--teal-ink);cursor:pointer}
.shotbtn input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2;-webkit-appearance:none;appearance:none}
.shotbtn .ic{width:24px;height:24px}
.shotbtn b{display:block;font-weight:600}
.shotbtn em{display:block;font-style:normal;font-size:13px;color:var(--mut)}
.shotbtn:focus-within{box-shadow:0 0 0 2px var(--teal)}
.shotmsg{font-size:14px;border-radius:14px;padding:10px 12px;margin:0 0 10px;background:var(--card);color:var(--mut)}
.shotmsg.busy{color:var(--teal-ink)}
.shotmsg.busy::before{content:'';display:inline-block;width:11px;height:11px;margin-right:8px;border:2px solid var(--teal);border-right-color:transparent;border-radius:50%;vertical-align:-1px;animation:spin .8s linear infinite}
.shotmsg.ok{background:var(--teal-2);color:var(--teal-ink)} .shotmsg.err{background:var(--amber-2);color:#6b4b07}
@keyframes spin{to{transform:rotate(360deg)}}
.reps{background:var(--card);border-radius:20px;padding:4px 14px}
.rep{display:grid;grid-template-columns:22px 74px 82px 1fr 30px;gap:8px;align-items:center;padding:8px 0}
.rep+.rep{border-top:1px solid var(--line)}
.rep .n{font-weight:700;color:var(--faint);font-size:14px}
.rep label{display:flex;align-items:baseline;gap:3px;background:var(--field);border-radius:10px;padding:6px 8px;font-size:12px;color:var(--mut)}
.rep input{width:100%;min-width:0;border:0;background:transparent;font-size:16px;font-weight:600;color:var(--ink);padding:0;-webkit-appearance:none;appearance:none}
.rep input:focus{outline:none}
.rep input::placeholder{color:#b9c3bf}
.rep label:focus-within{box-shadow:0 0 0 2px var(--teal)}
.rep .p{font-size:13px;color:var(--mut);line-height:1.2}
.rep .p.ok{color:var(--teal-ink)} .rep .p.fast{color:var(--violet)} .rep .p.slow{color:var(--amber)}
.rep .del{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.rep .del .ic{width:16px;height:16px}
.addrep{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:44px;margin-top:8px;border-radius:14px;border:1.5px dashed #c8d1ce;color:var(--teal-ink);font-weight:600;font-size:15px}
.repsum{margin:8px 4px 0;font-size:14px;color:var(--mut)}
.segs{background:var(--card);border-radius:20px;padding:6px 14px}
.seg{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 14px 30px;gap:8px;align-items:center;padding:8px 0}
.seg .n{font-weight:700;color:var(--faint);font-size:14px}
.sf{display:flex;align-items:baseline;gap:4px;background:var(--field);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--mut);min-width:0}
.sf input{width:100%;min-width:0;border:0;background:transparent;font-size:17px;font-weight:600;color:var(--ink);padding:0;-webkit-appearance:none;appearance:none}
.sf input:focus{outline:none}
.sf input::placeholder{color:#b9c3bf}
.sf:focus-within{box-shadow:0 0 0 2px var(--teal)}
.seg .mk i{display:block;width:10px;height:10px;border-radius:50%}
.seg .mk i.ok{background:var(--teal)} .seg .mk i.fast{background:var(--violet)} .seg .mk i.slow{background:var(--amber)}
.seg .del{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.seg .del .ic{width:16px;height:16px}
.rest{display:flex;align-items:center;gap:10px;margin:0 0 0 30px;padding:2px 0 4px;font-size:13px;color:var(--mut);border-left:2px dashed var(--line);padding-left:12px}
.rest .sf{width:96px;padding:6px 10px}
.rest .sf input{font-size:15px}
.fields.calc input{color:var(--teal-ink)}
.btns{display:flex;gap:8px;margin-top:22px}
.btn{flex:1;height:52px;border-radius:999px;background:var(--teal);color:#fff;font-weight:700;font-size:16px}
.btn.done{background:var(--teal-2);color:var(--teal-ink)}
.btn.sec{flex:0 0 auto;padding:0 18px;background:var(--card);color:var(--ink)}
.btn.gymc{background:var(--violet)} .btn.gymc.done{background:var(--violet-2);color:#4d3a92}
.btn.dng{background:var(--red-2);color:var(--red)}
.linkbtn{color:var(--teal-ink);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px 0}

/* selector de día */
.picker{background:var(--card);border-radius:20px;padding:14px;margin-top:10px}
.pk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:var(--mut)}
.pk-head b{color:var(--ink)}
.pk-x{width:32px;height:32px;border-radius:50%;background:var(--field);display:grid;place-items:center;color:var(--mut)}
.pk-x .ic{width:16px;height:16px}
.pk-grid{display:grid;grid-template-columns:24px repeat(7,minmax(0,1fr));gap:4px}
.pk-dh{text-align:center;font-size:12px;font-weight:700;color:var(--faint)}
.pk-wl{align-self:center;font-size:11px;font-weight:700;color:var(--faint)}
.pk-d{position:relative;height:48px;border-radius:14px;background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.pk-d b{font-size:15px;font-weight:600}
.pk-d small{position:absolute;top:2px;right:4px;font-size:8px;font-weight:700;color:var(--coral);text-transform:uppercase}
.pk-dots{display:flex;gap:3px;height:6px}
.pk-dots u,.pk-leg u{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal)}
u.g{background:var(--violet)} u.r{background:var(--coral)}
.pk-d.past{background:transparent;color:var(--faint)}
.pk-d.tdy b{color:var(--teal);text-decoration:underline;text-underline-offset:3px}
.pk-d.orig{box-shadow:inset 0 0 0 1.5px #b8c2be}
.pk-d.cur{background:var(--teal);color:#fff;box-shadow:none}
.pk-d.cur b{color:#fff}
.pk-d.cur u{box-shadow:0 0 0 1.5px #fff}
.pk-d:disabled{opacity:.25;cursor:default}
.pk-leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--mut)}
.pk-leg span{display:inline-flex;align-items:center;gap:5px}
.pk-leg i{display:inline-block;width:12px;height:10px;border-radius:3px;box-shadow:inset 0 0 0 1.5px #b8c2be}
.pk-foot{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--mut)}

/* TÚ */
.prof{display:flex;align-items:center;gap:14px}
.prof .av2{width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;flex:0 0 auto}
.prof b{display:block;font-size:22px;font-weight:700}
.prof span{font-size:14px;color:var(--mut)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--card);border-radius:20px;padding:14px 16px}
.tile b{display:block;font-size:24px;font-weight:700;letter-spacing:-.01em}
.tile span{font-size:13px;color:var(--mut)}
.chart{width:100%;height:auto;display:block}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--mut);font:12px var(--font)}

.sbtn{height:42px;padding:0 16px;border-radius:999px;background:var(--field);font-weight:600;font-size:14px}

/* barra inferior */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

<body>
<div class="wrap" id="app"></div>
<noscript><div class="wrap">Esta página necesita JavaScript activado.</div></noscript>
<script>
(function(){
'use strict';

/* ====== Configuración del perfil (cada copia del HTML tiene su propio ID) ====== */
var PROFILE_ID='chico';
var DEFAULT_NAME='Chico';
var DEFAULT_FORMULA='tanaka'; /* tanaka (hombres) o gulati (mujeres) */
var KEY='plan10k_2026_'+PROFILE_ID;

var START='2026-10-26', RACE='2026-12-31';
var DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
var MONTHS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var AMBER='#ffb84d', GREEN='#4ade80', BLUE='#5ea8ff', MUT='#8fb0d8';

/* ====== Plan base (semana a semana) ======
   Carrera A = la de cambios de ritmo cuando toca (bloques largos con descanso y, una vez,
   series cortas); carrera B = tirada larga. Descargas y semana del 10K, sin cambios de ritmo. */
var WEEKS=[
  {A:{km:3,t:'suave'},   B:{km:4}},
  {A:{km:4,t:'suave'},   B:{km:5}},
  {A:{km:4.5,t:'s400'},  B:{km:6}},
  {A:{km:3,t:'rectas'},  B:{km:5}, descarga:true},
  {A:{km:5.5,t:'b2x2'},  B:{km:7}},
  {A:{km:6,t:'b3x15'},   B:{km:8}},
  {A:{km:4,t:'suave'},   B:{km:6}, descarga:true},
  {A:{km:7,t:'b3x2'},    B:{km:8}},
  {A:{km:7,t:'b2x3'},    B:{km:9}},
  {A:{km:3,t:'rectas'},  race:true}
];
/* Entrenos por tramos: n tramos de km cada uno a k × ritmo de 10K estimado, con descanso entre ellos */
var BLK={
  s400: {n:6,km:0.4,k:0.95,rest:1.5,how:'trotando suave',short:true},
  b2x2: {n:2,km:2,  k:1.00,rest:3,  how:'andando o trotando'},
  b3x15:{n:3,km:1.5,k:0.99,rest:3,  how:'andando o trotando'},
  b3x2: {n:3,km:2,  k:1.00,rest:3,  how:'andando o trotando'},
  b2x3: {n:2,km:3,  k:1.00,rest:4,  how:'andando o trotando'}
};
var SER=BLK; /* compatibilidad con el resto del código */
function distTxt(km){return km>=1?fmtKm(km)+' km':Math.round(km*1000)+' m';}
/* Tramos registrados: [{km,pace,rest}] (rest = minutos de descanso después del tramo).
   Si se dividió una carrera ya apuntada, log.ref guarda su total para completar el último tramo. */
function segRows(log){
  var rows=((log&&log.segs)||[]).map(function(r){return {km:num(r.km),pace:num(r.pace),rest:num(r.rest),autoKm:false,autoPace:false};});
  var ref=log&&log.ref,n=rows.length;
  if(ref&&n>=2){
    var last=rows[n-1],other=0,otherT=0,ok=true;rows.slice(0,-1).forEach(function(r){other+=r.km;otherT+=r.km*r.pace;if(!(r.km&&r.pace))ok=false;});
    if(!last.km&&num(ref.km)-other>0.05){last.km=Math.round((num(ref.km)-other)*100)/100;last.autoKm=true;}
    /* ritmo del último tramo: el que hace cuadrar el tiempo total apuntado */
    if(!last.pace&&num(ref.pace)&&last.km){var pc=ok?(num(ref.km)*num(ref.pace)-otherT)/last.km:num(ref.pace);last.pace=Math.round((pc>=150&&pc<=900)?pc:num(ref.pace));last.autoPace=true;}
  }
  return rows;
}
function segTotals(log){
  var rows=segRows(log),km=0,t=0,rest=0,n=0;
  rows.forEach(function(r,i){if(r.km>0&&r.pace>0){km+=r.km;t+=r.km*r.pace;n++;}if(i<rows.length-1)rest+=r.rest;});
  return {rows:rows,n:n,km:km,pace:km?t/km:0,time:t,rest:rest};
}
function syncSegs(log){var T=segTotals(log);if(T.n>=2){log.km=Math.round(T.km*100)/100;log.pace=Math.round(T.pace);}return T;}
/* Señal de forma de un entreno por tramos planificado: ritmo de cada tramo / su factor → ritmo de 10K equivalente */
function segSig(log,t){
  var B=BLK[t];if(!B)return 0;
  var a=0,w=0;segTotals(log).rows.forEach(function(r){if(r.km>=0.2&&r.pace>=150&&r.pace<=600){a+=r.pace/B.k*r.km;w+=r.km;}});
  return w&&segTotals(log).n>=2?a/w:0;
}
function parseTimeIn(s){
  s=String(s||'');var m=s.match(/^(\d{1,2}):(\d{1,2})$/),v;
  if(m)v=(+m[1])*60+(m[2].length===1?(+m[2])*10:+m[2]);
  else if(/^\d{1,2}$/.test(s))v=+s;
  else return 0;
  return (v>=10&&v<=1800)?v:0;
}

/* ====== Utilidades ====== */
function clamp(x,a,b){return Math.min(b,Math.max(a,x));}
function pad(n){return (n<10?'0':'')+n;}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseDate(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parseDate(s);d.setDate(d.getDate()+n);return fmtDate(d);}
function diffDays(a,b){return Math.round((parseDate(b)-parseDate(a))/86400000);}
function todayStr(){return (window.__TODAY)||fmtDate(new Date());}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0;}
function fmtKm(n){return String(Math.round(n*10)/10).replace('.',',');}
function fmtKm2(n){return String(Math.round(n*100)/100).replace('.',',');}
function shortDate(s){var d=parseDate(s);return d.getDate()+' '+MONTHS[d.getMonth()];}
function secToPace(sec){if(!isFinite(sec)||sec<=0)return '–';var m=Math.floor(sec/60),r=Math.round(sec-m*60);if(r===60){m++;r=0;}return m+':'+pad(r);}
function secToHMS(sec){var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.round(sec%60);if(s===60){s=0;m++;}return h?h+':'+pad(m)+':'+pad(s):m+':'+pad(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ====== Sesiones del plan: calendario base + cambios de día del usuario ======
   Cada sesión tiene un id fijo (su día original). Los registros y objetivos se
   guardan por id, así que mover una sesión de día no pierde nada. */
var BASE=[];
WEEKS.forEach(function(w,wi){
  var ws=addDays(START,wi*7);
  function add(di,o){o.id=addDays(ws,di);o.wi0=wi;BASE.push(o);}
  add(1,{kind:'run',slot:'A',base:w.A});
  add(2,{kind:'gym',gym:1});
  if(w.race){
    add(3,{kind:'race',slot:'B',base:{km:10,t:'race'}});
  }else{
    add(4,{kind:'gym',gym:2});
    add(6,{kind:'run',slot:'B',base:{km:w.B.km,t:'tirada'}});
  }
});
var SESSIONS=[];
function dayIndex(date){return (parseDate(date).getDay()+6)%7;}
function refreshSessions(){
  SESSIONS.length=0;
  BASE.forEach(function(b){
    var s={},k;for(k in b)s[k]=b[k];
    var mv=(b.kind!=='race'&&state.moves)?state.moves[b.id]:null;
    s.date=mv||b.id;
    s.di=dayIndex(s.date);
    s.wi=clamp(Math.floor(diffDays(START,s.date)/7),0,WEEKS.length-1);
    s.moved=s.date!==b.id;
    SESSIONS.push(s);
  });
  var ord={run:0,race:0,gym:1};
  SESSIONS.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:((ord[a.kind]-ord[b.kind])||(a.id<b.id?-1:1)));});
}

/* ====== Estado y almacenamiento ====== */
function fcTeo(f,age){age=num(age)||30;return Math.round(f==='gulati'?206-0.88*age:208-0.7*age);}
function defaultState(){return {v:5,name:DEFAULT_NAME,ref3k:'5:30',age:30,fcmax:String(fcTeo(DEFAULT_FORMULA,30)),fcmaxSrc:'teo-'+DEFAULT_FORMULA,fcmaxDate:'',logs:{},moves:{},pattern:{A:1,B:6,G1:2,G2:4},updatedAt:0};}
var state=defaultState(), storageOK=true;
function load(){
  try{
    localStorage.setItem(KEY+'_t','1');localStorage.removeItem(KEY+'_t');
    var raw=localStorage.getItem(KEY);
    if(raw){var s=JSON.parse(raw);if(s&&typeof s==='object'){state=Object.assign(defaultState(),s);if(!state.logs)state.logs={};var v0=s.v;migrate();if(v0!==state.v)saveLocal();}}
  }catch(e){storageOK=false;}
}
function migrate(){
  /* versiones anteriores guardaban minutos y segundos: se convierten a ritmo */
  var L=state.logs||{},k,l,t,km;
  for(k in L){l=L[k];if(!l)continue;
    if(l.min!=null||l.sec!=null){t=num(l.min)*60+num(l.sec);km=num(l.km);if(!(num(l.pace)>0)&&t>0&&km>0)l.pace=Math.round(t/km);delete l.min;delete l.sec;}}
  for(k in L){l=L[k];if(l&&l.reps){var rr=l.reps.filter(function(r){return r&&num(r.d)>0;});if(rr.length&&!l.segs)l.segs=rr.map(function(r){return {km:num(r.d)/1000,pace:num(r.t)>0?Math.round(num(r.t)/num(r.d)*1000):0,rest:0};});delete l.reps;}}
  if(!state.moves)state.moves={};
  if(!num(state.fcmax)){state.fcmax=String(fcTeo(DEFAULT_FORMULA,state.age));state.fcmaxSrc='teo-'+DEFAULT_FORMULA;}
  if(!state.fcmaxSrc)state.fcmaxSrc='manual';
  if(!num(state.age))state.age=30;
  state.v=5;
}
function parsePaceIn(s){
  var m=String(s||'').match(/^(\d{1,2}):(\d{1,2})$/),mm,ss;
  if(m){mm=+m[1];ss=m[2].length===1?(+m[2])*10:+m[2];}
  else if(/^\d{1,2}$/.test(String(s||''))){mm=+s;ss=0;}
  else return 0;
  var v=mm*60+ss;
  return (ss<60&&v>=150&&v<=900)?v:0;
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}}
/* Copia en la cuenta de Claude del que mira (privada: data/users/<id>/). Si no está disponible, solo navegador. */
var CLOUD={ref:null,st:'local',busy:false,dirty:false,t:null};
function save(){state.updatedAt=Date.now();saveLocal();if(CLOUD.ref){clearTimeout(CLOUD.t);CLOUD.t=setTimeout(cloudPush,1200);}}
function cloudPush(){
  if(!CLOUD.ref)return;
  if(CLOUD.busy){CLOUD.dirty=true;return;}
  CLOUD.busy=true;
  CLOUD.ref.set({json:JSON.stringify(state),updatedAt:state.updatedAt||Date.now()}).then(function(){CLOUD.st='cloud';},function(e){
    if(e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked'||e.code==='capability_disabled')){CLOUD.ref=null;CLOUD.st='local';}else CLOUD.st='err';
  }).then(function(){CLOUD.busy=false;if(CLOUD.dirty){CLOUD.dirty=false;cloudPush();}});
}
function cloudInit(){
  var C=window.claude;if(!C||!C.use)return;
  Promise.all([C.use('db'),C.use('user')]).then(function(r){
    var db=r[0],u=r[1];if(!db||!u)return null;
    return u.id().then(function(id){if(!id)return null;CLOUD.ref=db.collection('data/users/'+id).doc('plan10k-'+PROFILE_ID);return CLOUD.ref.get();});
  }).then(function(snap){
    if(!snap||!CLOUD.ref)return;
    var d=snap.exists?snap.data():null,remote=null;
    try{remote=d&&d.json?JSON.parse(d.json):null;}catch(e){remote=null;}
    if(remote&&(remote.updatedAt||0)>(state.updatedAt||0)){state=Object.assign(defaultState(),remote);if(!state.logs)state.logs={};migrate();saveLocal();CLOUD.st='cloud';render();}
    else if(!remote||(state.updatedAt||0)>(remote.updatedAt||0)){cloudPush();}
    else{CLOUD.st='cloud';}
    if(ui.tab==='you')render();
  }).catch(function(){CLOUD.ref=null;CLOUD.st='local';});
}

/* ====== Ritmos y pulsaciones ====== */
function parsePace(s){
  s=String(s==null?'':s).trim().replace(',','.');
  var m=s.match(/^(\d+):(\d{1,2})$/);
  if(m)return (+m[1])*60+(+m[2]);
  var n=parseFloat(s);
  return n>0?n*60:0;
}
function baseP10(){var p=parsePace(state.ref3k)||330;return p*Math.pow(10/3,0.06);}
function fcmax(){var v=num(state.fcmax);return (v>=120&&v<=230)?v:0;}
function isEasy(t){return t==='suave'||t==='tirada'||t==='rectas';}
function effortK(t,hr){
  var fm=fcmax();
  if(hr>0&&fm){var p=hr/fm;if(p<=0.80)return 1.10;if(p<=0.88)return 1.03;return 1.00;}
  if(isEasy(t))return 1.06;
  if(t==='medio2'||t==='series3')return 1.03;
  return 1.0;
}
function median(a){var b=a.slice().sort(function(x,y){return x-y;}),n=b.length;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2;}
function pacePlan(hist,ref,slow,E0){
  var fm=fcmax();
  var rec=hist.filter(function(h){return h.status==='done'&&h.sig>0&&diffDays(h.date,ref)<=28;}).slice(-4);
  var E=E0,brake=false;
  if(rec.length>=2){
    var med=median(rec.map(function(h){return h.sig;}));
    var gain=Math.max(0,E0-med)*0.6;
    var cap=E0*Math.min(0.08,0.01*Math.max(0,diffDays(START,ref))/7);
    E=E0-Math.min(gain,cap);
  }
  if(fm){
    var hs=hist.filter(function(h){return h.status==='done'&&h.easy&&h.hr>0;}).slice(-3);
    if(hs.length>=2){
      var avg=hs.reduce(function(a,h){return a+h.hr;},0)/hs.length;
      if(avg/fm>0.85){brake=true;E=Math.max(E,E0);}
    }
  }
  E*=slow;
  return {P10:E,easy:[E*1.07,E*1.13],medio:[E*0.97,E*1.0],nsig:rec.length,brake:brake};
}

/* ====== Motor de adaptación ======
   Cada carrera se calcula con lo ocurrido ANTES de ella, así los objetivos de
   carreras pasadas no cambian al registrar cosas nuevas. */
function compute(today){
  var info={}, hist=[], summary=null, paceNow=null, lastPace=null, E0=baseP10();
  SESSIONS.forEach(function(s){
    if(s.kind!=='run'&&s.kind!=='race')return;
    var log=state.logs[s.id]||{};
    var done=!!log.done;
    var status=done?'done':(s.date<today?'missed':'pending');
    var km=num(log.km);
    var ref=s.date<today?s.date:today;
    var lastDone=null;
    for(var i=hist.length-1;i>=0;i--){if(hist[i].status==='done'){lastDone=hist[i];break;}}
    var gap=diffDays(lastDone?lastDone.date:START,ref);
    var target,t=s.base.t,fEff=1,downgraded=false,gapNote=0,ev=[],nrep=0,why='';
    if(s.kind==='race'){target=10;}
    else{
      ev=hist.filter(function(h){return h.status!=='pending';}).slice(-4);
      var sum=2,den=2; /* valor neutro 1,0 con peso 2 para suavizar */
      ev.forEach(function(h,i){
        var w=i+1;
        var r=h.status==='missed'?0.7:clamp((h.km>0?h.km:h.target)/h.target,0.5,1.3);
        sum+=r*w;den+=w;
      });
      var f=sum/den;
      if(gap>17){f*=0.8;gapNote=gap;}else if(gap>10){f*=0.9;gapNote=gap;}
      f=clamp(f,0.6,1.1);
      var ahead=diffDays(today,s.date);
      var wdec=ahead>7?Math.min(1,(ahead-7)/21):0;
      fEff=1+(f-1)*(1-wdec);
      var k=s.base.km*fEff;
      /* las series solo se mantienen si la carga va bien y no vienes de un parón */
      if(s.base.t!=='suave'&&s.base.t!=='tirada'){
        if(fEff<0.88){t='suave';downgraded=true;why='la carga reciente está por debajo de lo previsto';}
        else if(gapNote&&SER[s.base.t]){t='suave';downgraded=true;why='vienes de '+gapNote+' días sin correr';}
      }
      var best=3;
      hist.forEach(function(h){
        var v=h.status==='done'?(h.km>0?h.km:h.target):(h.status==='pending'?h.target:0);
        if(v>best)best=v;
      });
      k=Math.min(k,best+(s.slot==='B'?1.5:1),s.slot==='B'?10:7.5);
      target=Math.max(2,Math.round(k*2)/2);
      if(BLK[t]){var df=BLK[t];nrep=fEff<0.97?Math.max(df.short?3:2,Math.round(df.n*fEff)):(fEff>=1.06&&df.short?df.n+1:df.n);}
      if(!summary&&status==='pending'){
        var ds=ev.filter(function(h){return h.status==='done';});
        var ms=ev.length-ds.length, rs=[];
        if(ev.length){
          var avg=ds.length?Math.round(100*ds.reduce(function(a,h){return a+clamp((h.km>0?h.km:h.target)/h.target,0.5,1.3);},0)/ds.length):null;
          rs.push('Últimas '+ev.length+' carreras: '+ds.length+' hechas'+(avg!=null?' ('+avg+' % de lo previsto)':'')+(ms?' y '+ms+' sin hacer':'')+'.');
        }else rs.push('Aún no hay carreras registradas: se sigue el plan base.');
        if(gapNote)rs.push('Llevas '+gapNote+' días sin correr: se reduce la carga para retomar con seguridad.');
        summary={f:fEff,reasons:rs};
      }
    }
    /* ritmos: se estiman con lo hecho antes de esta sesión */
    var slow=gap>17?1.03:(gap>10?1.015:(fEff<0.9?1.015:1));
    var pace=pacePlan(hist,ref,slow,E0);
    var time=num(log.pace)*km,hr=num(log.hr),sig=0,ssg=segSig(log,t),ST=segTotals(log);
    if(done&&ssg)sig=ssg;
    else if(done&&time>0&&km>=3&&!BLK[t])sig=(time/km)*Math.pow(10/km,0.06)/effortK(t,hr)*(ST.n>=2&&ST.rest>0?1.02:1);
    info[s.id]={target:target,base:s.base.km,t:t,baseT:s.base.t,f:fEff,status:status,downgraded:downgraded,why:why,pace:pace,nrep:nrep};
    hist.push({date:s.date,status:status,km:km,target:target,hr:hr,sig:sig,easy:isEasy(t)});
    if(!paceNow&&status==='pending')paceNow=pace;
    lastPace=pace;
  });
  return {info:info,summary:summary,paceNow:paceNow||lastPace,E0:E0};
}

/* ====== Agregados ====== */
function weekAgg(wi,C,today){
  var a={plan:0,base:0,done:0,sess:0,sessDone:0,missed:0};
  SESSIONS.forEach(function(s){
    if(s.wi!==wi||s.kind==='rest')return;
    a.sess++;
    var log=state.logs[s.id]||{};
    if(log.done)a.sessDone++;else if(s.date<today)a.missed++;
    if(s.kind!=='gym'){
      var I=C.info[s.id];
      a.plan+=I.target;a.base+=I.base;
      if(log.done)a.done+=num(log.km)||I.target;
    }
  });
  var ws=addDays(START,wi*7), we=addDays(ws,6);
  a.now=today>=ws&&today<=we;
  a.status=(a.sess&&a.sessDone===a.sess)?'complete':(a.missed>0?'missed':(a.now?'now':'future'));
  return a;
}

function computeStats(C,today){
  var S={runs:[],kmTot:0,secTot:0,kmTime:0,bestPace:0,longest:0,runEval:0,runDone:0,gymEval:0,gymDone:0,
         weekPlan:[],weekDone:[],weekBase:[],longBase:[],longTarget:[],longDone:[]};
  SESSIONS.forEach(function(s){
    var log=state.logs[s.id]||{};
    if(s.kind==='gym'){
      if(log.done||s.date<today){S.gymEval++;if(log.done)S.gymDone++;}
    }else if(s.kind==='run'||s.kind==='race'){
      var I=C.info[s.id];
      if(log.done||s.date<today){S.runEval++;if(log.done)S.runDone++;}
      if(log.done){
        var km=num(log.km)||I.target, time=num(log.pace)*km;
        S.runs.push({date:s.date,kind:s.kind,slot:s.slot,km:km,time:time,pace:time>0?time/km:0,hr:num(log.hr),easy:isEasy(I.t)});
        S.kmTot+=km;var ck=contKm(log,I);if(ck>S.longest)S.longest=ck;
        if(time>0){S.secTot+=time;S.kmTime+=km;var p=time/km;if(!S.bestPace||p<S.bestPace)S.bestPace=p;}
      }
    }
  });
  for(var wi=0;wi<WEEKS.length;wi++){
    var ag=weekAgg(wi,C,today);
    S.weekPlan.push(ag.plan);S.weekDone.push(ag.done);S.weekBase.push(ag.base);
    var bs=SESSIONS.filter(function(s){return s.wi0===wi&&s.slot==='B'&&(s.kind==='run'||s.kind==='race');})[0];
    if(bs){
      var BI=C.info[bs.id],bl=state.logs[bs.id]||{};
      S.longBase.push(bs.base.km);S.longTarget.push(BI.target);
      S.longDone.push(bl.done?contKm(bl,BI):null);
    }else{S.longBase.push(null);S.longTarget.push(null);S.longDone.push(null);}
  }
  return S;
}

/* Distancia continua más larga de una carrera: con tramos, el tramo más largo; si no, el total */
function contKm(log,I){
  var T=segTotals(log);
  if(T.n>=2){var mx=0;T.rows.forEach(function(r){if(r.km>mx)mx=r.km;});return mx;}
  return num(log.km)||(I?I.target:0);
}
function contPlanned(I){return BLK[I.t]?BLK[I.t].km:I.target;}
function readiness(C,today){
  var projBest=0,bestDone=0;
  SESSIONS.forEach(function(s){
    if(s.kind!=='run')return;
    var I=C.info[s.id],log=state.logs[s.id]||{};
    var km=I.status==='done'?contKm(log,I):(I.status==='pending'?contPlanned(I):0);
    if(km>projBest)projBest=km;
    if(I.status==='done'&&km>bestDone)bestDone=km;
  });
  var R=C.info[RACE],cls,txt;
  if(R.status==='done'){cls='ok';txt='10K completado. ¡Objetivo cumplido!';}
  else if(today>RACE){cls='warn';txt='La fecha del 10K ya ha pasado sin registrarse. Puedes marcarlo en la semana 10 o seguir con otra fecha.';}
  else if(projBest<8){cls='bad';txt='Con el progreso actual, la tirada más larga antes del 10K sería de '+fmtKm(projBest)+' km. Plan B: correr el 10K alternando carrera y tramos andando, o fijar una fecha posterior. Es una estimación orientativa, no una norma.';}
  else if(projBest<9){cls='warn';txt='Con el progreso actual, la tirada más larga prevista antes del 10K es de '+fmtKm(projBest)+' km: el 10K exigirá ir muy suave y dosificar.';}
  else{cls='ok';txt='Progresión en camino: tirada más larga prevista antes del 10K de '+fmtKm(projBest)+' km.';}
  return {cls:cls,txt:txt,projBest:projBest,bestDone:bestDone};
}

/* ====== Textos de sesión ====== */
function pr(r){return secToPace(r[0])+'–'+secToPace(r[1]);}
function hrCap(){var fm=fcmax();return fm?Math.round(fm*0.8):0;}
function runDesc(t,km,downgraded,P,nrep){
  var k=fmtKm(km),e=pr(P.easy),cap=hrCap(),hrTxt=cap?' Pulsaciones por debajo de '+cap+'.':'',d;
  if(BLK[t]){var df=BLK[t],p=P.P10*df.k;
    return 'Calienta 10–15 min suave. '+nrep+'×'+distTxt(df.km)+' a '+secToPace(p)+' /km, con '+fmtKm(df.rest)+' min '+df.how+' entre cada uno. Termina con 5–10 min suaves. Unos '+k+' km en total.';}
  switch(t){
    case 'suave': d=k+' km a ritmo suave, sin forzar ('+e+' /km).'+hrTxt;break;
    case 'tirada': d=k+' km a ritmo suave ('+e+' /km).'+hrTxt+' Si cuesta, alterna 9 min corriendo y 1 min andando.';break;
    case 'rectas': d=k+' km suaves ('+e+' /km) y, al final, 4 rectas de 20 s progresivas, recuperando andando.'+hrTxt;break;
    case 'race': d='Sal controlado los primeros 2 km a unos '+secToPace(P.P10*1.02)+' /km y aprieta solo si vas bien en los últimos 3 km.';break;
    default: d=k+' km.';
  }
  return d;
}
function gymDesc(s){
  var w=WEEKS[s.wi0],d;
  if(s.gym===1){
    if(w.race)return 'Tren superior suave, core y movilidad, sin pierna pesada para llegar fresco al 10K.';
    d='Sentadilla, peso muerto rumano, zancadas, press y remo. 3 series de 8–10 repeticiones.';
  }else{
    d='Press, jalón o dominadas, remo, hombro y plancha, sin pierna pesada. 3 series de 8–12 repeticiones.';
  }
  if(w.descarga)d+=' Semana de descarga: baja la carga un 20–30 %.';
  return d;
}
var TT={suave:'Carrera suave',tirada:'Tirada larga',rectas:'Suave + rectas',race:'10K'};
function sTitle(s,I){
  if(s.kind==='gym')return s.gym===1?(WEEKS[s.wi0].race?'Gimnasio ligero':'Gimnasio · pierna'):'Gimnasio · tren superior';
  if(s.kind==='race')return 'Día del 10K';
  if(BLK[I.t])return (BLK[I.t].short?'Series ':'Bloques ')+I.nrep+'×'+distTxt(BLK[I.t].km);
  return TT[I.t]||'Carrera';
}
function sSub(s,I){
  if(s.kind==='gym')return 'Fuerza · 45–60 min';
  var P=I.pace;
  if(s.kind==='race')return '10 km · objetivo '+secToHMS(P.P10*10*0.99)+'–'+secToHMS(P.P10*10*1.02);
  if(BLK[I.t])return fmtKm(I.target)+' km · tramos a '+secToPace(P.P10*BLK[I.t].k)+' /km';
  return fmtKm(I.target)+' km · '+pr(P.easy)+' /km';
}
function sKind(s){return s.kind==='gym'?'gym':(s.kind==='race'?'race':'run');}
function weekRange(wi){
  var a=addDays(START,wi*7),b=WEEKS[wi].race?RACE:addDays(a,6);
  return shortDate(a)+' – '+shortDate(b);
}
function curWeek(today){return clamp(Math.floor(diffDays(START,today)/7),0,WEEKS.length-1);}

/* ====== Gráficos SVG ====== */
var C_TEAL='#0b8a7e',C_TEAL2='#d3eeea',C_VIOLET='#7a5fc8',C_CORAL='#e2684d',C_LINE='#e2e7e5',C_FAINT='#9ba6a2';
function barChart(labels,A,B,cur){
  var W=340,H=170,pl=28,pr=6,pt=10,pb=24,iw=W-pl-pr,ih=H-pt-pb;
  var max=Math.max.apply(null,[5].concat(A,B));max=Math.ceil(max/5)*5;
  var n=labels.length,gw=iw/n,bw=Math.min(14,gw*0.55),i;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Km por semana">';
  for(i=0;i<=2;i++){var v=max*i/2,y=pt+ih-ih*i/2;
    s+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+'</text>';}
  labels.forEach(function(l,i){
    var cx=pl+gw*i+gw/2,ha=Math.max(0,ih*A[i]/max),hb=Math.max(0,ih*Math.min(B[i],A[i]||B[i])/max),hb2=ih*B[i]/max;
    s+='<rect x="'+(cx-bw/2)+'" y="'+(pt+ih-ha)+'" width="'+bw+'" height="'+ha+'" rx="'+(bw/2)+'" fill="'+C_TEAL2+'"/>';
    if(B[i]>0)s+='<rect x="'+(cx-bw/2)+'" y="'+(pt+ih-hb2)+'" width="'+bw+'" height="'+hb2+'" rx="'+(bw/2)+'" fill="'+C_TEAL+'"/>';
    s+='<text class="ax" x="'+cx+'" y="'+(H-6)+'" text-anchor="middle"'+(i===cur?' style="font-weight:700;fill:#1c2220"':'')+'>'+l+'</text>';
  });
  return s+'</svg>';
}
function lineChart(o){
  var W=340,H=170,pl=28,pr=8,pt=12,pb=24,iw=W-pl-pr,ih=H-pt-pb,n=o.labels.length,i;
  function X(i){return pl+(n===1?iw/2:iw*i/(n-1));}
  function Y(v){return pt+ih-ih*(v-o.yMin)/(o.yMax-o.yMin);}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.title)+'">';
  for(i=0;i<=2;i++){var v=o.yMin+(o.yMax-o.yMin)*i/2;
    s+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="'+(pl-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+o.yFmt(v)+'</text>';}
  (o.hLines||[]).forEach(function(h){
    s+='<line class="hl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(h.y)+'" y2="'+Y(h.y)+'"/><text class="hlt" x="'+(W-pr-2)+'" y="'+(Y(h.y)-5)+'" text-anchor="end">'+h.label+'</text>';});
  o.labels.forEach(function(l,i){if(o.every&&i%o.every)return;s+='<text class="ax" x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+l+'</text>';});
  o.series.forEach(function(se){
    var d='',started=false;
    se.pts.forEach(function(v,i){if(v==null){started=false;return;}d+=(started?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';started=true;});
    if(d&&!se.noLine)s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"'+(se.dash?' stroke-dasharray="4 5"':'')+'/>';
    if(!se.noDots)se.pts.forEach(function(v,i){if(v==null)return;s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="4.5" fill="'+(se.hollow?'#fff':se.color)+'" stroke="'+se.color+'" stroke-width="2.5"/>';});
  });
  return s+'</svg>';
}

/* ====== Lectura de capturas: interpretación del texto reconocido ====== */
function shotParse(lines){
  var MES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12,jan:1,apr:4,aug:8,dec:12};
  function norm(t){return String(t||'').replace(/[’´`′‘]/g,"'").replace(/[”″“]/g,'"').replace(/\s+/g,' ').trim();}
  var cl=[];
  (lines||[]).forEach(function(L,li){
    var ws=(L.words||[]).filter(function(w){return w&&w.text&&w.text.trim();});
    if(!ws.length)return;
    var h=Math.max(1,L.bbox.y1-L.bbox.y0),cur=null;
    ws.forEach(function(w){
      if(cur&&w.bbox.x0-cur.x1<=Math.max(28,h*1.1)){cur.words.push(w);cur.x1=w.bbox.x1;cur.y0=Math.min(cur.y0,w.bbox.y0);cur.y1=Math.max(cur.y1,w.bbox.y1);}
      else{cur={li:li,words:[w],x0:w.bbox.x0,x1:w.bbox.x1,y0:w.bbox.y0,y1:w.bbox.y1};cl.push(cur);}
    });
  });
  cl.forEach(function(c){
    c.text=norm(c.words.map(function(w){return w.text;}).join(' '));
    c.compact=c.text.replace(/\s+/g,'');
    /* versión para distancias: un signo pequeño entre cifras grandes es la coma decimal (el OCR lo lee como ".", "e", "o"...) */
    var ws2=c.words,kt='';
    ws2.forEach(function(w,i){
      var t=w.text,hw=w.bbox.y1-w.bbox.y0,pv=ws2[i-1],nx=ws2[i+1];
      var dh=Math.max(pv&&/\d/.test(pv.text)?pv.bbox.y1-pv.bbox.y0:0,nx&&/\d/.test(nx.text)?nx.bbox.y1-nx.bbox.y0:0);
      if(t.length<=2&&!/\d/.test(t)&&dh&&hw<dh*0.45&&pv&&nx&&/\d$/.test(pv.text)&&/^\d/.test(nx.text))kt+='.';
      else kt+=t;
    });
    c.kmtext=kt;
    c.h=Math.max.apply(null,[0].concat(c.words.filter(function(w){return /\d/.test(w.text);}).map(function(w){return w.bbox.y1-w.bbox.y0;})));
  });
  function parsePaceV(t){
    var m=t.match(/(\d{1,2})\s*['":]\s*(\d{2})/)||t.replace(/\s+/g,'').match(/^(\d{1,2})(\d{2})["']*(?:\/?km)?$/i);
    if(!m)return 0;var v=(+m[1])*60+(+m[2]);return (+m[2]<60&&v>=150&&v<=900)?v:0;}
  function parseHrV(t){if(/[:'"]/.test(t))return 0;var m=t.match(/\b(\d{2,3})\b/);var v=m?+m[1]:0;return (v>=60&&v<=220)?v:0;}
  function parseTimeV(t){var m=t.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);if(!m)return 0;return m[3]!=null?(+m[1])*3600+(+m[2])*60+(+m[3]):(+m[1])*60+(+m[2]);}
  function parseKmV(t,needUnit){
    var c=t.replace(/\s+/g,'');
    var m=c.match(/(\d{1,2}(?:[.,]\d{1,2})?)km\b/i)||(!needUnit&&c.match(/^(\d{1,2}[.,]\d{1,2})$/));
    if(!m)return 0;var v=parseFloat(m[1].replace(',','.'));return (v>0.3&&v<60)?v:0;}
  var P={
    pace:{re:/ritmo|pace|tempo/i,no:/card|m[aá]x|m[ií]n|[oó]ptim|mejor|best|r[aá]pid|lento/i,parse:parsePaceV},
    hr:{re:/card[ií]ac|frecuencia|pulso|pulsac|heart|\bfc\b|\bhr\b/i,no:/m[aá]x|m[ií]n|zona|zone|reposo|resting/i,parse:parseHrV},
    hrmax:{re:/card[ií]ac|frecuencia|pulso|pulsac|heart|\bfc\b|\bhr\b/i,need:/m[aá]x/i,no:/m[ií]n|zona|zone|reposo|resting|medi|prom|avg/i,parse:parseHrV},
    time:{re:/tiempo|duraci[oó]n|\btime\b|moving/i,no:/m[ií]nimo|r[eé]cord|mejor|best|r[aá]pid/i,parse:parseTimeV},
    km:{re:/distancia|distance/i,no:/^$/,parse:function(t){return parseKmV(t,false);}}
  };
  var AVG=/medi|prom|avg|average/i;
  function below(c){var h=c.y1-c.y0;return cl.filter(function(o){return o.li===c.li+1&&o.x0<c.x1&&o.x1>c.x0&&o.y0-c.y1<h*0.5;})[0];}
  function findVal(kind){
    var spec=P[kind],labels=[];
    cl.forEach(function(c){
      if(!spec.re.test(c.text))return;
      var b=below(c),full=c.text+(b&&!/\d/.test(b.text)?' '+b.text:'');
      if(spec.no.test(full))return;
      if(spec.need&&!spec.need.test(full))return;
      labels.push({c:c,avg:AVG.test(full)});
    });
    labels.sort(function(a,b){return (b.avg-a.avg)||(a.c.y0-b.c.y0);});
    for(var i=0;i<labels.length;i++){
      var L=labels[i].c,h=Math.max(10,L.y1-L.y0),cand=[];
      cl.forEach(function(o){
        if(o===L)return;
        var v=spec.parse(o.text);if(!v)return;
        var gap;
        if(o.li===L.li&&o.x0>=L.x1-5)gap=0;
        else if(o.x0<L.x1+h&&o.x1>L.x0-h){
          if(o.y1<=L.y0+5)gap=L.y0-o.y1;else if(o.y0>=L.y1-5)gap=o.y0-L.y1+h*0.3;else return;
          if(gap>h*4)return;
        }else return;
        cand.push({v:v,g:gap});
      });
      cand.sort(function(a,b){return a.g-b.g;});
      if(cand.length)return cand[0].v;
    }
    return 0;
  }
  var out={km:0,pace:0,hr:0,hrmax:0,time:0,date:''};
  out.pace=findVal('pace');out.hr=findVal('hr');out.hrmax=findVal('hrmax');if(out.hrmax&&out.hr&&out.hrmax<=out.hr)out.hrmax=0;out.time=findVal('time');out.km=findVal('km');
  if(!out.km){
    var best=null;
    cl.forEach(function(c){var v=parseKmV(c.kmtext,true);if(v&&(!best||c.h>best.h))best={v:v,h:c.h};});
    if(best)out.km=best.v;
  }
  /* control cruzado: si la distancia no cuadra con tiempo y ritmo, se recalcula */
  if(out.km&&out.time&&out.pace){var k2=out.time/out.pace;if(Math.abs(out.km-k2)/k2>0.25&&k2>0.3&&k2<60)out.km=Math.round(k2*100)/100;}
  if(!out.pace&&out.time&&out.km){var pc=out.time/out.km;if(pc>=150&&pc<=900)out.pace=Math.round(pc);}
  var all=cl.map(function(c){return c.text;}).join(' \n ');
  var dm=all.match(/\b(\d{1,2})\s+(?:de\s+)?([a-zá]{3})[a-zá]*\.?(?:\s+de)?,?\s+(20\d{2})\b/i)||null;
  if(dm&&MES[dm[2].toLowerCase()])out.date=dm[3]+'-'+('0'+MES[dm[2].toLowerCase()]).slice(-2)+'-'+('0'+dm[1]).slice(-2);
  else{var dn=all.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2})\b/);if(dn)out.date=dn[3]+'-'+('0'+dn[2]).slice(-2)+'-'+('0'+dn[1]).slice(-2);}
  return out;
}

/* ====== Lectura de capturas: reconocimiento de texto en el propio navegador ======
   Usa Tesseract.js. La imagen no sale del dispositivo; solo se descarga el lector
   (unos 5 MB) la primera vez, y el navegador lo guarda. */
var OCR={p:null,cur:null};
var OCR_SRC=window.__OCR_LOCAL?'ocr/tesseract.min.js':'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
var IN_CLAUDE=!!(window.claude&&window.claude.use);
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.async=true;s.onload=function(){res();};s.onerror=function(){rej(new Error('net'));};document.head.appendChild(s);});}
var OCR_ST={'loading tesseract core':'Cargando el lector (solo la primera vez)…','initializing tesseract':'Preparando el lector…','loading language traineddata':'Cargando el idioma (solo la primera vez)…','initializing api':'Preparando el lector…','recognizing text':'Leyendo la captura…'};
function ocrMsg(t){if(!OCR.cur)return;var el=document.getElementById('shot-msg-'+OCR.cur);if(el)el.textContent=t;}
function absUrl(p){try{return new URL(p,location.href).href;}catch(e){return p;}}
/* El idioma se deja en la caché de Tesseract (IndexedDB) antes de arrancarlo: así no necesita descargarlo de fuera */
function idbReq(mode,key,val){return new Promise(function(res){try{
  var rq=indexedDB.open('keyval-store');
  rq.onupgradeneeded=function(){rq.result.createObjectStore('keyval');};
  rq.onsuccess=function(){try{var db=rq.result,tx=db.transaction('keyval',mode),st=tx.objectStore('keyval'),g=mode==='readonly'?st.get(key):st.put(val,key),out;
    g.onsuccess=function(){out=g.result;};tx.oncomplete=function(){db.close();res(mode==='readonly'?out:true);};tx.onerror=tx.onabort=function(){db.close();res(mode==='readonly'?undefined:false);};}catch(e){res(undefined);}};
  rq.onerror=function(){res(undefined);};
}catch(e){res(undefined);}});}
function seedLang(){
  return idbReq('readonly','./spa.traineddata').then(function(v){
    if(v)return true;
    ocrMsg('Cargando el idioma (solo la primera vez)…');
    return fetch(absUrl('ocr/spa.traineddata.wasm')).then(function(r){if(!r.ok)throw new Error('net');return r.arrayBuffer();},function(){throw new Error('net');})
      .then(function(buf){return idbReq('readwrite','./spa.traineddata',new Uint8Array(buf));});
  });
}
function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'));},ms);p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
function getOcr(){
  if(OCR.p)return OCR.p;
  OCR.p=withTimeout((window.Tesseract?Promise.resolve():loadScript(OCR_SRC)).then(seedLang).then(function(){
    return window.Tesseract.createWorker('spa',1,{workerPath:absUrl('ocr/worker.min.js'),corePath:absUrl('ocr/'),langPath:absUrl('ocr'),workerBlobURL:false,
      errorHandler:function(){},

function prepImage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      try{
        var w=img.naturalWidth,h=img.naturalHeight,k=w<1100?2:(w>2400?2400/w:1);
        if(w*k*h*k>14e6)k=Math.sqrt(14e6/(w*h));
        var cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
        var cx=cv.getContext('2d');cx.drawImage(img,0,0,cv.width,cv.height);
        var d=cx.getImageData(0,0,cv.width,cv.height),a=d.data,i,sum=0,n=a.length/4,mn=255,mx=0,g;
        for(i=0;i<a.length;i+=4){g=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];a[i]=g;sum+=g;if(g<mn)mn=g;if(g>mx)mx=g;}

        for(i=0;i<a.length;i+=4){g=(a[i]-mn)*255/rg;if(inv)g=255-g;a[i]=a[i+1]=a[i+2]=g;}
        cx.putImageData(d,0,0);URL.revokeObjectURL(url);res(cv);
      }catch(e){URL.revokeObjectURL(url);rej(e);}
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}

/* --- hoja de detalle de una sesión --- */

    log.segs=[];

  }

}
function segsView(s,I,log,T){

function bottomNav(){
  function b(tab,icon,label){return '<button class="'+(ui.tab===tab?'on':'')+'" data-act="tab" data-tab="'+tab+'"'+(ui.tab===tab?' aria-current="page"':'')+'><span class="pill2">'+ic(icon)+'</span>'+label+'</button>';}
  return '<nav class="bnav"><div class="in">'+b('today','sun','Hoy')+b('plan','plan','Plan')+b('you','you','Tú')+'</div></nav>';
}

function render(){
  refreshSessions();
  var today=todayStr(),C=compute(today),app=document.getElementById('app');
  var qs=typeof document.querySelector==='function';
  var sh=qs?document.querySelector('.sheet'):null,top=sh?sh.scrollTop:0;
  var body=ui.tab==='plan'?planView(C,today):(ui.tab==='you'?youView(C,today):todayView(C,today));
  app.innerHTML=topBar(today)+body+bottomNav()+sheetView(C,today);
  if(qs){
    var sh2=document.querySelector('.sheet');if(sh2&&top)sh2.scrollTop=top;
    if(document.body&&document.body.classList)document.body.classList.toggle('lock',!!ui.sheet);
    var st=document.getElementById('wstrip');
    if(st&&st.querySelector){var on=st.querySelector('.chip.on');if(on)st.scrollLeft=on.offsetLeft-(st.clientWidth-on.offsetWidth)/2;}
  }
}

/* ====== Eventos ====== */
var rt=null;
function scheduleRender(){
  clearTimeout(rt);
  rt=setTimeout(function(){
    var a=document.activeElement;
    if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')){scheduleRender();return;}
    render();
  },700);
}
function openDetails(){ /* recuerda qué apartado de Ajustes está abierto */
  if(typeof document.querySelectorAll!=='function')return;
  var o=null;[].forEach.call(document.querySelectorAll('.set details'),function(d,i){if(d.open)o=['perfil','dias','datos','reglas'][i];});
  ui.open=o;
}
document.getElementById('app').addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  if(!el||el.disabled)return;
  var act=el.getAttribute('data-act');
  if(act==='noop')return;
  if(ui.confirm&&act!==ui.confirm)ui.confirm=null;
  if(ui.tab==='you')openDetails();
  var id=el.getAttribute('data-id');
  if(act==='tab'){ui.tab=el.getAttribute('data-tab');ui.msg='';ui.msg2='';ui.picker=null;ui.patDraft=null;ui.sheet=null;if(ui.tab==='plan')ui.week=curWeek(todayStr());render();window.scrollTo(0,0);}
  else if(act==='goweek'){ui.week=+el.getAttribute('data-w');render();}
  else if(act==='open'){ui.sheet=id;ui.picker=null;var so=sessById(id);if(so)ui.week=so.wi;render();}
  else if(act==='closesheet'){ui.sheet=null;ui.picker=null;render();}
  else if(act==='picker'){ui.picker=ui.picker===id?null:id;render();}
  else if(act==='moveto'){
    var md=el.getAttribute('data-date');
    if(!state.moves)state.moves={};
    if(md===id)delete state.moves[id];else state.moves[id]=md;
    save();ui.picker=null;if(ui.shot[id])ui.shot[id].date='';refreshSessions();
    var ms=sessById(id);if(ms)ui.week=ms.wi;
    render();
  }
  else if(act==='splitseg'||act==='addseg'){
    var C1=compute(todayStr()),lg=materialize(id,C1.info[id]);
    if(act==='addseg'){var lt=lg.segs[lg.segs.length-1];if(lt&&!num(lt.rest))lt.rest=BLK[C1.info[id].t]?BLK[C1.info[id].t].rest:5;lg.segs.push({km:0,pace:0,rest:0});}
    syncSegs(lg);save();render();
  }
  else if(act==='delseg'){
    var C2=compute(todayStr()),lg2=materialize(id,C2.info[id]);lg2.segs.splice(+el.getAttribute('data-i'),1);
    if(lg2.segs.length)lg2.segs[lg2.segs.length-1].rest=0;
    if(lg2.segs.length<2){if(lg2.segs.length===1&&num(lg2.segs[0].km)&&num(lg2.segs[0].pace)){lg2.km=num(lg2.segs[0].km);lg2.pace=num(lg2.segs[0].pace);}else if(lg2.ref){lg2.km=lg2.ref.km;lg2.pace=lg2.ref.pace;}delete lg2.segs;delete lg2.ref;}
    else syncSegs(lg2);
    save();render();
  }
  else if(act==='pat'){ui.patDraft[el.getAttribute('data-k')]=+el.getAttribute('data-i');ui.msg2='';render();}
  else if(act==='toggle'){
    var d=el.getAttribute('data-date'),log=state.logs[d]||(state.logs[d]={});
    if(log.done){log.done=false;}
    else{
      var s=sessById(d);
      if((s.kind==='run'||s.kind==='race')&&!(num(log.km)>0)){log.km=compute(todayStr()).info[d].target;}
      log.done=true;
    }
    save();render();
  }
  else if(act==='saveset'){
    var nm=document.getElementById('set-name').value.trim();
    state.name=nm||DEFAULT_NAME;
    state.ref3k=document.getElementById('set-ref').value.trim()||'5:30';
    var nf=document.getElementById('set-fcmax').value.trim(),na=Math.round(num(document.getElementById('set-age').value));
    if(na>=10&&na<=90)state.age=na;
    if(nf!==String(state.fcmax)){state.fcmax=nf;state.fcmaxSrc='manual';}
    save();ui.msg='Guardado.';render();
  }
  else if(act==='fcteo'){
    var ff=el.getAttribute('data-f');state.fcmax=String(fcTeo(ff,state.age));state.fcmaxSrc='teo-'+ff;save();ui.msg='FC máxima teórica aplicada: '+state.fcmax+' ppm.';render();
  }
  else if(act==='export'){
    ui.backup=JSON.stringify(state);ui.msg='Copia generada. Si no se ha copiado sola, toca el texto, selecciónalo todo y cópialo.';
    render();
    var ta=document.getElementById('bk');
    var sel=function(){if(ta){try{ta.focus();ta.select();}catch(err){}}};
    try{navigator.clipboard.writeText(ui.backup).then(function(){var m=document.getElementById('bk-msg');if(m)m.textContent='Copia generada y copiada. Pégala en Notas para guardarla.';},sel);}catch(err){sel();}
  }
  else if(act==='import'){
    var ta2=document.getElementById('bk'),txt=ta2?ta2.value.trim():'';
    try{
      var o=JSON.parse(txt);
      if(!o||typeof o!=='object'||typeof o.logs!=='object')throw new Error('formato');
      state=Object.assign(defaultState(),o);migrate();save();ui.backup='';ui.msg='Copia importada correctamente.';render();
    }catch(err){ui.msg='No se ha podido importar: el texto no es una copia válida.';ui.backup=txt;render();}
  }
  else if(act==='applypat'){
    var keys=['A','B','G1','G2'],pt2={};
    keys.forEach(function(k){pt2[k]=+ui.patDraft[k];});
    state.pattern=pt2;if(!state.moves)state.moves={};
    var tdy=todayStr(),cnt=0,lastD=addDays(RACE,-1);
    BASE.forEach(function(b){
      if(b.kind==='race')return;
      if((state.logs[b.id]||{}).done)return;
      var key=b.kind==='gym'?(b.gym===1?'G1':'G2'):b.slot;
      var nd=addDays(addDays(START,b.wi0*7),pt2[key]);
      if(nd>lastD)nd=lastD;
      if(nd<tdy)return;
      if(nd===b.id)delete state.moves[b.id];else state.moves[b.id]=nd;
      cnt++;
    });
    save();ui.msg2='Días aplicados a '+cnt+' sesiones.';render();
  }
  else if(act==='resetpat'){
    if(ui.confirm!=='resetpat'){ui.confirm='resetpat';render();return;}
    ui.confirm=null;state.moves={};state.pattern={A:1,B:6,G1:2,G2:4};ui.patDraft=null;save();ui.msg2='Calendario original restaurado. Los registros se conservan.';render();
  }
  else if(act==='reset'){
    if(ui.confirm!=='reset'){ui.confirm='reset';render();return;}
    ui.confirm=null;state.logs={};save();ui.msg='Registros borrados.';render();
  }
});

function fmtClock(el){
  var raw=String(el.value).replace(/[.,'´]/g,':').replace(/[^\d:]/g,'');
  var m=raw.match(/^(\d*):(\d*)$/);
  if(!(m&&m[2].length<=2)){var dg=raw.replace(/:/g,'').slice(0,4);raw=dg.length>=3?dg.slice(0,-2)+':'+dg.slice(-2):dg;}
  if(raw!==el.value)el.value=raw;
  return raw;
}
document.getElementById('app').addEventListener('input',function(e){
  var el=e.target;
  if(!el.getAttribute||!el.getAttribute('data-field'))return;
  var d=el.getAttribute('data-date'),f=el.getAttribute('data-field');
  var log=state.logs[d]||(state.logs[d]={});
  if((f==='km'||f==='pace')&&segTotals(log).n>=2){return;}
  if(f==='km'){var v=num(el.value);if(v>0&&v<100)log.km=v;else delete log.km;}
  else if(f==='pace'){var pc=parsePaceIn(fmtClock(el));if(pc)log.pace=pc;else delete log.pace;}
  else if(f==='hr'){var w=Math.round(num(el.value));if(w>=60&&w<=230)log.hr=w;else delete log.hr;}
  else if(f==='seg-km'||f==='seg-pace'||f==='seg-rest'){
    var I=compute(todayStr()).info[d],lg=materialize(d,I),i=+el.getAttribute('data-i');
    while(lg.segs.length<=i)lg.segs.push({km:0,pace:0,rest:0});
    if(f==='seg-km'){var kv=num(el.value);lg.segs[i].km=(kv>0&&kv<60)?kv:0;}
    else if(f==='seg-pace')lg.segs[i].pace=parsePaceIn(fmtClock(el));
    else{var rv=num(el.value);lg.segs[i].rest=(rv>=0&&rv<=60)?rv:0;}
    syncSegs(lg);
  }
  save();scheduleRender();
});
document.getElementById('app').addEventListener('change',function(e){
  var el=e.target;
  if(!el.getAttribute||!el.getAttribute('data-shot'))return;
  var f=el.files&&el.files[0];if(f)readShot(el.getAttribute('data-shot'),f);
});
document.getElementById('app').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.getAttribute&&e.target.getAttribute('data-field'))e.target.blur();
  if(e.key==='Escape'&&ui.sheet){ui.sheet=null;ui.picker=null;render();}
});

/* ====== Arranque ====== */
load();
render();
try{cloudInit();}catch(e){}
try{aiInit();}catch(e){}
var lastDay=todayStr();
setInterval(function(){var t=todayStr();if(t!==lastDay){lastDay=t;render();}},60000);
window.PLAN10K={shotParse:shotParse,readShot:readShot,compute:compute,parsePaceIn:parsePaceIn,segTotals:segTotals,segSig:segSig,SESSIONS:SESSIONS,BASE:BASE,weekWarnings:weekWarnings,getState:function(){return state;},ui:ui};
})();
